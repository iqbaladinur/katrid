name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (vMAJOR.MINOR.PATCH)'
        required: true

permissions:
  contents: write

env:
  # Optional. When absent the build falls back to a debug-signed APK.
  KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

jobs:
  release:
    name: Build & publish APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK platform 35
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Derive version from tag
        id: version
        env:
          REF: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${REF#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Ref '$REF' is not vMAJOR.MINOR.PATCH (e.g. v0.2.0)"
            exit 1
          fi
          IFS=. read -r MAJOR MINOR PATCH <<< "$VERSION"
          CODE=$((10#$MAJOR * 10000 + 10#$MINOR * 100 + 10#$PATCH))
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Releasing $VERSION (versionCode $CODE)"

      - name: Unit tests
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Decode signing key
        if: env.KEYSTORE_BASE64 != ''
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"

      - name: Build signed release APK
        if: env.KEYSTORE_BASE64 != ''
        working-directory: android
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
          KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease --stacktrace \
            -PversionName="$VERSION_NAME" -PversionCode="$VERSION_CODE"

      - name: Build debug APK (no signing key configured)
        if: env.KEYSTORE_BASE64 == ''
        working-directory: android
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          echo "::warning::KEYSTORE_BASE64 is not set — publishing a debug-signed APK."
          ./gradlew :app:assembleDebug --stacktrace \
            -PversionName="$VERSION_NAME" -PversionCode="$VERSION_CODE"

      - name: Stage APK and notes
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
          SIGNED: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          set -euo pipefail
          mkdir -p dist
          if [ "$SIGNED" = "true" ]; then
            cp android/app/build/outputs/apk/release/app-release.apk "dist/kartrid-${VERSION_NAME}.apk"
            SIGN_LINE="APK is signed with the project release key."
          else
            cp android/app/build/outputs/apk/debug/app-debug.apk "dist/kartrid-${VERSION_NAME}-debug.apk"
            SIGN_LINE="**No release signing key is configured**, so this APK is debug-signed. Uninstall any older Kartrid build before installing it."
          fi
          cat > "$RUNNER_TEMP/notes.md" <<EOF
          ## Install

          \`\`\`bash
          adb install -r kartrid-${VERSION_NAME}.apk
          \`\`\`

          Kartrid is a frontend, not an emulator: you still need RetroArch plus the Gambatte / mGBA cores.
          Android 8.0+ (minSdk 26), built for the KONKR Pocket Advance (960×640 landscape).

          ${SIGN_LINE}
          EOF
          ls -lh dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          name: Kartrid ${{ steps.version.outputs.name }}
          body_path: ${{ runner.temp }}/notes.md
          files: dist/*.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
